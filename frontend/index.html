<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian Research Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23d9541e'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"><span></span></span>
        <span class="brand-text">
          <strong>Meridian</strong>
          <small>Research Desk</small>
        </span>
      </a>

      <nav class="nav" aria-label="Primary">
        <a href="#/" data-nav="overview"><span class="nav-num">01</span>Overview</a>
        <a href="#/run" data-nav="run"><span class="nav-num">02</span>New run</a>
        <a href="#/packs" data-nav="packs"><span class="nav-num">03</span>Research packs</a>
        <a href="#/corpus" data-nav="corpus"><span class="nav-num">04</span>Corpus</a>
        <a href="#/runs" data-nav="runs"><span class="nav-num">05</span>Run history</a>
        <a href="#/system" data-nav="system"><span class="nav-num">06</span>System</a>
      </nav>

      <div id="sidebar-run" class="sidebar-run" hidden></div>

      <div class="sidebar-foot mono">
        <span>Use case 02</span>
        <span>Multi-agent research</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 5h14M2 9h14M2 13h14" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <div class="crumbs mono" id="crumbs">Research desk</div>
        <div class="topbar-right">
          <span class="status-pill" id="status-pill"><span class="dot"></span><span class="label">Pipeline idle</span></span>
          <a class="btn btn-primary btn-sm" href="#/run">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.6"/></svg>
            New run
          </a>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Document detail"></aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div id="modal-root" hidden></div>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
